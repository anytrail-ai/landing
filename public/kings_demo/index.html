<!doctype html>
<html lang="en-CA">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#fefdf6">
<title>King's Sales Desk · Anytrail</title>
<link rel="icon" href="/anytrail-mark.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Funnel+Display:wght@300..800&family=Funnel+Sans:wght@300..800&family=Montserrat:wght@300;400&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Anytrail "Quote Sheet" system (see DESIGN.md): cream paper, hairline rules, ink actions,
   moss only for confirmed/healthy state. Layout: left rail of views, working canvas, slide-in drawer. */
:root{
  --bg:#fefdf6; --card:#ffffff; --tint:#f6f4ea; --line:#e7e2d1;
  --ink:#000000; --ink-soft:#1f1f1f; --text:#111827; --graphite:#6b7280; --ash:#78716c;
  --moss:#2f6f4f; --moss-soft:#e8f0eb;
  --amber:#8a5a12; --amber-soft:#f5ecd8; --brick:#9b3b2a; --brick-soft:#f5e4df;
  --sans:"Funnel Sans", system-ui, "Segoe UI", Roboto, sans-serif;
  --display:"Funnel Display", "Funnel Sans", system-ui, sans-serif;
  --mono:"JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  color-scheme:light;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--text);font-family:var(--sans);font-size:14px;line-height:1.5;-webkit-font-smoothing:antialiased}
img{max-width:100%}
[hidden]{display:none!important}
h1,h2,h3{font-family:var(--display);font-weight:400;margin:0;text-wrap:balance}
h1{font-size:30px;line-height:36px;letter-spacing:-.6px}
h2{font-size:18px;line-height:24px;letter-spacing:-.2px}
.num,td.n,.mono{font-variant-numeric:tabular-nums}
.mono{font-family:var(--mono);font-size:12.5px}
.muted{color:var(--graphite)}
.label{font-size:12px;line-height:16px;text-transform:uppercase;letter-spacing:.08em;color:var(--ash)}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--moss);outline-offset:2px}
a{color:inherit}

.app{display:grid;grid-template-columns:240px minmax(0,1fr);min-height:100vh}
.side{position:sticky;top:0;height:100vh;display:flex;flex-direction:column;gap:24px;border-right:1px solid var(--line);
  padding-block:22px;padding-left:max(18px,env(safe-area-inset-left,0px));padding-right:18px}
.lockup{display:flex;align-items:center;gap:9px;text-decoration:none}
.lockup img{width:26px;height:26px}
.lockup span{font-family:Montserrat,var(--sans);font-weight:300;font-size:19px;letter-spacing:.01em;color:var(--text)}
.client{display:flex;flex-direction:column;gap:2px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:12px}
.client b{font-weight:600;font-size:14.5px}
.client small{color:var(--graphite);font-size:12.5px}
nav{display:flex;flex-direction:column;gap:2px}
nav a{display:flex;justify-content:space-between;align-items:center;padding:8px 10px;border-radius:6px;text-decoration:none;color:var(--graphite);transition:background-color .2s ease-out}
nav a:hover{background:var(--tint);color:var(--text)}
nav a[aria-current="page"]{background:var(--card);color:var(--text);box-shadow:inset 0 0 0 1px var(--line)}
nav .count{font-size:11.5px;font-variant-numeric:tabular-nums;background:var(--amber-soft);color:var(--amber);padding:1px 8px;border-radius:999px}
.side-foot{margin-top:auto;font-size:12.5px;color:var(--ash);line-height:1.5}
.btn{display:inline-flex;align-items:center;gap:6px;align-self:flex-start;border:1px solid var(--line);background:var(--card);padding:9px 14px;border-radius:6px;font-size:14px;line-height:1;transition:background-color .2s ease-out;white-space:nowrap}
.btn:hover{background:var(--tint)}
.btn.primary{background:var(--ink);color:#fff;border-color:var(--ink)}
.btn.primary:hover{background:var(--ink-soft)}
.btn.sm{padding:6px 10px;font-size:12.5px}
.btn:disabled{opacity:.4;cursor:default}

main{min-width:0;padding-block:32px 80px;padding-left:max(16px,min(44px,4vw));padding-right:max(16px,env(safe-area-inset-right,0px),min(44px,4vw))}
.wrap{max-width:1180px;display:flex;flex-direction:column;gap:24px}
.head{display:flex;justify-content:space-between;align-items:flex-end;gap:16px;flex-wrap:wrap}
.head>div{display:flex;flex-direction:column;gap:8px;min-width:0}
.head p{margin:0;color:var(--graphite);font-size:15px;max-width:620px}
.notice{font-size:13px;color:var(--graphite);border-left:2px solid var(--line);padding:2px 0 2px 14px;max-width:820px}
.notice b{color:var(--text);font-weight:600}

.kpis{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.kpis.k5{grid-template-columns:repeat(5,minmax(0,1fr))}
.kpi{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 18px;display:flex;flex-direction:column;gap:4px;min-width:0}
.kpi .v{font-family:var(--display);font-size:26px;line-height:32px;letter-spacing:-.4px;font-variant-numeric:tabular-nums}
.kpi .s{font-size:12.5px;color:var(--graphite)}
.up{color:var(--moss)} .down{color:var(--brick)}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 22px;min-width:0}
.card-h{display:flex;justify-content:space-between;align-items:baseline;gap:12px;flex-wrap:wrap;margin-bottom:14px}
.legend{display:flex;gap:16px;font-size:12.5px;color:var(--graphite);flex-wrap:wrap}
.legend i{display:inline-block;width:16px;height:0;border-top:2px solid;vertical-align:middle;margin-right:6px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}

.chart{position:relative;width:100%}
.chart svg{display:block;overflow:visible}
.chart text{font-family:var(--sans);font-size:11px;fill:var(--ash);font-variant-numeric:tabular-nums}
.tip{position:absolute;pointer-events:none;background:var(--text);color:#fff;font-size:12.5px;padding:6px 10px;border-radius:6px;white-space:nowrap;transform:translate(-50%,-100%);top:0;z-index:2}
.tip b{font-weight:600}

.list{display:flex;flex-direction:column}
.li{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:10px 0;border:0;border-top:1px solid var(--line);text-align:left;background:none;width:100%}
.li:first-child{border-top:0}
button.li:hover .li-t{text-decoration:underline;text-underline-offset:3px}
.li-t{font-weight:600}
.li small{display:block;color:var(--graphite);font-size:12.5px;font-weight:400}

.pill{display:inline-block;font-size:12px;font-weight:500;padding:3px 10px;border-radius:999px;white-space:nowrap}
.pill.good{color:var(--moss);background:var(--moss-soft)}
.pill.warn{color:var(--amber);background:var(--amber-soft)}
.pill.bad{color:var(--brick);background:var(--brick-soft)}
.pill.info{color:var(--graphite);background:var(--tint);box-shadow:inset 0 0 0 1px var(--line)}

.bars{display:flex;flex-direction:column;gap:10px}
.bar-row{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:3px 12px;font-size:13.5px}
.bar-row>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-row .track{grid-column:1/-1;height:6px;background:var(--tint);border-radius:3px;overflow:hidden}
.bar-row .fill{height:100%;background:var(--text);border-radius:3px}
.bar-row .fill.alt{background:var(--graphite)}

.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.chip{border:1px solid var(--line);background:var(--card);padding:6px 12px;border-radius:999px;font-size:13px;color:var(--graphite);transition:background-color .2s ease-out}
.chip:hover{background:var(--tint)}
.chip[aria-pressed="true"]{background:var(--text);color:#fff;border-color:var(--text)}
.search,.select{border:1px solid var(--line);background:var(--card);color:var(--text);padding:8px 11px;border-radius:6px;font:inherit;min-width:0;max-width:100%}
.search{width:230px}

.tbl-wrap{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;width:100%;min-width:760px}
th,td{padding:10px 16px;text-align:left;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11.5px;text-transform:uppercase;letter-spacing:.08em;color:var(--ash);font-weight:400;background:var(--tint)}
th.n,td.n{text-align:right}
th button{background:none;border:0;padding:0;font:inherit;text-transform:inherit;letter-spacing:inherit;color:inherit}
th button[aria-sort]{color:var(--text)}
th button[aria-sort]::after{content:" ↓"}
tbody tr[data-cust],tbody tr[data-prod]{cursor:pointer}
tbody tr[data-cust]:hover,tbody tr[data-prod]:hover{background:var(--bg)}
tbody tr:last-child td{border-bottom:0}
td .sub{display:block;font-size:12.5px;color:var(--graphite)}
td b{font-weight:600}
tr.total td{font-weight:600;background:var(--tint)}
td.fc{color:var(--graphite)}
.pcell{display:flex;align-items:center;gap:12px}
.thumb{width:38px;height:38px;border-radius:6px;object-fit:cover;background:var(--tint);border:1px solid var(--line);flex:none}

.method{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}
.method div{font-size:14px;color:var(--graphite);display:flex;flex-direction:column;gap:6px}
.method b{color:var(--text);font-weight:600;display:flex;align-items:center;gap:10px}
.step{width:26px;height:26px;border-radius:50%;background:var(--moss-soft);color:var(--moss);display:inline-grid;place-items:center;font-size:13px;flex:none}

.board{display:grid;grid-template-columns:repeat(5,minmax(214px,1fr));gap:12px;overflow-x:auto;padding-bottom:6px}
.col{background:var(--tint);border-radius:12px;padding:10px;display:flex;flex-direction:column;gap:8px;min-width:0}
.col-h{display:flex;flex-direction:column;font-size:12.5px;padding:2px 4px 6px;color:var(--graphite)}
.col-h b{font-size:14px;color:var(--text);font-weight:600}
.deal{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:11px 13px;display:flex;flex-direction:column;gap:6px;font-size:13px}
.deal .t{font-weight:600;font-size:14px}
.deal .row{display:flex;justify-content:space-between;align-items:center;gap:6px}

.scrim{position:fixed;inset:0;background:rgba(17,24,39,.28);opacity:0;pointer-events:none;transition:opacity .2s;z-index:20}
.scrim.on{opacity:1;pointer-events:auto}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(640px,100%);background:var(--bg);border-left:1px solid var(--line);z-index:21;overflow-y:auto;transform:translateX(102%);transition:transform .28s cubic-bezier(.16,1,.3,1);
  padding-top:calc(22px + env(safe-area-inset-top,0px));padding-bottom:calc(36px + env(safe-area-inset-bottom,0px));padding-left:22px;padding-right:max(22px,env(safe-area-inset-right,0px));display:flex;flex-direction:column;gap:16px}
.drawer.on{transform:none}
.dh{display:flex;justify-content:space-between;gap:12px;align-items:flex-start}
.dh>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.dh .hero-img{width:84px;height:84px;border-radius:12px;object-fit:cover;border:1px solid var(--line);background:var(--tint)}
.x{border:1px solid var(--line);background:var(--card);width:34px;height:34px;border-radius:6px;flex:none;font-size:18px;line-height:1}
.mini{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px}
.mini div{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px}
.mini b{display:block;font-family:var(--display);font-weight:400;font-size:19px;font-variant-numeric:tabular-nums}
.mini span{font-size:12px;color:var(--graphite)}
.next{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;display:flex;flex-direction:column;gap:10px}
.next ul{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.next li{display:flex;justify-content:space-between;gap:10px}

.modal{position:fixed;inset:0;display:grid;place-items:center;z-index:30;padding:16px;background:rgba(17,24,39,.32)}
.modal form{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:22px;width:min(480px,100%);display:flex;flex-direction:column;gap:14px}
.field{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600}
.field select,.field input{font:inherit;font-weight:400;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);min-width:0;width:100%}
.lines{display:grid;grid-template-columns:minmax(0,1fr) 84px;gap:8px}
.actions{display:flex;justify-content:flex-end;gap:8px}
.toast{position:fixed;left:50%;top:calc(16px + env(safe-area-inset-top,0px));transform:translate(-50%,-20px);background:var(--text);color:#fff;padding:11px 18px;border-radius:999px;font-size:13.5px;opacity:0;transition:.25s;z-index:40;max-width:calc(100% - 32px)}
.toast.on{opacity:1;transform:translate(-50%,0)}

.rep-head{display:flex;flex-direction:column;gap:6px;padding-bottom:18px;border-bottom:1px solid var(--line)}
.rep-meta{display:flex;gap:18px;flex-wrap:wrap;font-size:13px;color:var(--graphite)}
details.card summary{cursor:pointer;font-family:var(--display);font-size:18px}
details.card[open] summary{margin-bottom:12px}
.print-only{display:none}
.o2c{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:0;position:relative}
.o2c>div{display:flex;flex-direction:column;gap:6px;padding-right:16px;position:relative;font-size:13.5px;color:var(--graphite)}
.o2c>div:not(:last-child)::after{content:"";position:absolute;top:13px;left:34px;right:8px;height:1px;background:var(--line)}
.o2c b{color:var(--text);font-weight:600}
.assume{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
.assume label{display:flex;flex-direction:column;gap:5px;font-size:12.5px;color:var(--graphite)}
.assume input{font:inherit;font-size:14px;padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);width:100%;min-width:0;font-variant-numeric:tabular-nums}
.asof{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:24px;align-items:start}
.asof .big{font-family:var(--display);font-size:34px;line-height:40px;letter-spacing:-.6px;font-variant-numeric:tabular-nums}
.ledger{display:flex;flex-direction:column;font-size:13.5px}
.ledger div{display:flex;justify-content:space-between;gap:12px;padding:6px 0;border-top:1px solid var(--line)}
.ledger div:first-child{border-top:0}
.ledger .tot{font-weight:600}
.check{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--graphite)}
.o2c.o5{grid-template-columns:repeat(5,minmax(0,1fr))}

/* v2: team, orders, inventory, notes, deductions, portal */
.nav-g{font-size:11px;line-height:14px;text-transform:uppercase;letter-spacing:.08em;color:var(--ash);padding:14px 10px 4px}
.nav-g:first-child{padding-top:0}
nav .count.hot{background:var(--brick-soft);color:var(--brick)}
.who{display:flex;flex-direction:column;gap:5px}
.who .select{width:100%}
.side{overflow-y:auto}
a.kpi{text-decoration:none;color:inherit;transition:background-color .2s ease-out}
a.kpi:hover{background:var(--tint)}
.av{width:22px;height:22px;border-radius:50%;background:var(--ink);color:#fff;display:inline-grid;place-items:center;font-size:9.5px;font-weight:600;letter-spacing:.02em;flex:none}
.av.pm{background:var(--moss)}.av.lc{background:var(--amber)}.av.sys{background:var(--ash)}
.owner{display:inline-flex;align-items:center;gap:7px;white-space:nowrap;vertical-align:middle}
.linkbtn{background:none;border:0;padding:0;font:inherit;color:inherit;text-decoration:underline;text-underline-offset:3px}
tbody tr[data-po]{cursor:pointer}
tbody tr[data-po]:hover{background:var(--bg)}
tr.claimed td:first-child{box-shadow:inset 3px 0 0 var(--brick)}
tr.isnew td:first-child{box-shadow:inset 3px 0 0 var(--amber)}
tr.flash td{animation:flash 3s ease-out}
@keyframes flash{0%,35%{background:var(--amber-soft)}100%{background:transparent}}
.steps{display:inline-flex;gap:3px;vertical-align:middle}
.steps i{width:14px;height:4px;border-radius:2px;background:var(--line)}
.steps i.on{background:var(--text)}
.steps.big{display:flex;width:100%}
.steps.big i{flex:1;height:6px}
.steplbl{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:3px;font-size:12px;color:var(--graphite)}
.steplbl .on{color:var(--text);font-weight:600}
.timeline{display:flex;flex-direction:column;font-size:13.5px}
.timeline>div{display:grid;grid-template-columns:112px minmax(0,1fr);gap:12px;padding:9px 0;border-top:1px solid var(--line)}
.timeline>div:first-child{border-top:0}
.timeline small{color:var(--graphite);font-size:12px}
.note{border-top:1px solid var(--line);padding:11px 0;display:flex;flex-direction:column;gap:4px;font-size:13.5px}
.note .meta{font-size:12px;color:var(--graphite);display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.contact{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px;padding:10px 0;border-top:1px solid var(--line);font-size:13.5px}
.contact:first-child{border-top:0}
.contact.left{color:var(--ash)}
.contact.left b{text-decoration:line-through;font-weight:500}
.contact small{grid-column:1/-1;color:var(--graphite);font-size:12.5px}
.iform{display:flex;flex-direction:column;gap:8px}
.iform .r2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}
.iform select,.iform input,.iform textarea,.field textarea{font:inherit;font-weight:400;padding:8px 10px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);width:100%;min-width:0}
.iform textarea,.field textarea{min-height:64px;resize:vertical}
.iform .btn{align-self:flex-start}
.ripple{position:fixed;right:max(16px,env(safe-area-inset-right,0px));bottom:calc(16px + env(safe-area-inset-bottom,0px));width:min(410px,calc(100% - 32px));background:var(--card);border:1px solid var(--line);border-radius:14px;box-shadow:0 14px 36px rgba(17,24,39,.16);padding:14px 16px 16px;z-index:35;opacity:0;transform:translateY(14px);transition:opacity .25s,transform .25s;pointer-events:none;display:flex;flex-direction:column;gap:4px}
.ripple.on{opacity:1;transform:none;pointer-events:auto}
.ripple ol{list-style:none;margin:6px 0 0;padding:0;display:flex;flex-direction:column;gap:7px;font-size:13px}
.ripple li{display:grid;grid-template-columns:84px minmax(0,1fr);gap:10px;opacity:0;animation:rin .4s ease-out forwards}
.ripple li>span:first-child{font-size:11px;text-transform:uppercase;letter-spacing:.06em;color:var(--moss);padding-top:2px}
@keyframes rin{from{opacity:0;transform:translateX(10px)}to{opacity:1;transform:none}}
.answer{font-size:14.5px;padding:12px 14px;border-radius:10px;background:var(--tint);line-height:1.5}
.answer.good{background:var(--moss-soft)}
.answer.good>b:first-child{color:var(--moss)}
.answer.bad{background:var(--brick-soft)}
.answer.bad>b:first-child{color:var(--brick)}
th.plan,td.plan{background:var(--amber-soft)!important}
td.lock{color:var(--ash)}
th.grp{text-align:center;font-size:11px}
.stockq{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.alert-row{display:grid;grid-template-columns:auto minmax(0,1fr);gap:12px;padding:12px 0;border-top:1px solid var(--line)}
.alert-row:first-child{border-top:0}
.alert-row>div{display:flex;flex-direction:column;gap:6px;min-width:0}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chips .chip{font-size:12.5px;padding:5px 10px}
.portal{border:1px solid var(--line);border-radius:16px;overflow:hidden;background:var(--card)}
.portal-bar{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;padding:14px 20px;background:var(--ink);color:#fff}
.portal-bar b{font-family:var(--display);font-weight:400;font-size:18px}
.portal-bar span{font-size:13px;opacity:.8}
.portal-body{padding:18px 20px 22px;display:flex;flex-direction:column;gap:16px}
.qty{width:80px;font:inherit;padding:6px 8px;border:1px solid var(--line);border-radius:6px;background:var(--bg);color:var(--text);text-align:right;font-variant-numeric:tabular-nums}
.ok-box{display:flex;flex-direction:column;gap:6px;align-items:flex-start;padding:16px 18px;border-radius:12px;background:var(--moss-soft)}
.ok-box b{font-size:15px;color:var(--moss)}
.ok-box span{font-size:13.5px}
.modal form{max-height:calc(100vh - 32px);overflow-y:auto}
.two{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}

/* ---------- generate 24 months of orders + Nov 1–7 ---------- */
let orders=[];
(function gen(){
 CUSTOMERS.forEach(c=>{
  for(let m=0;m<=N;m++){
   if(m<(c.start||0)||m>(c.end??99))continue;
   const d0=monthDate(m),cal=d0.getMonth(),dim=new Date(d0.getFullYear(),cal+1,0).getDate();
   const s=SEASON[c.season][cal];
   let target=c.base*Math.pow(1+c.growth,m)*s*(1+.1*gauss());
   if(c.start!=null&&m-c.start<3)target*=(m-c.start+1)/3;
   let n=c.freq*Math.sqrt(s);n=Math.max(1,Math.floor(n)+(rnd()<n%1?1:0));
   for(let k=0;k<n;k++){
    const day=1+Math.floor(rnd()*dim);
    if(m===N&&day>=TODAY.getDate())continue;
    const value=target/n;
    const cand=Object.entries(c.mix).map(([pid,w])=>{const p=P[pid];let wt=w*(p.tag?PSEASON[p.tag][cal]:1)*Math.pow(1+(p.trend||0),m);
      if(c.drop&&c.drop[pid]!=null&&m>c.drop[pid])wt=0;return{pid,wt}}).filter(x=>x.wt>0);
    const kk=Math.min(cand.length,Math.max(2,c.lines-1+Math.floor(rnd()*2)));
    const picks=[],pool=cand.slice();
    while(picks.length<kk&&pool.length){let r=rnd()*sum(pool.map(x=>x.wt)),i=0;while(r>pool[i].wt&&i<pool.length-1){r-=pool[i].wt;i++}picks.push(pool.splice(i,1)[0])}
    const sh=picks.map(x=>x.wt*(.6+.8*rnd())),st=sum(sh);
    const lines=picks.map((x,i)=>({p:x.pid,qty:Math.max(1,Math.round(value*sh[i]/st/P[x.pid].price)),price:P[x.pid].price}));
    orders.push({c:c.id,date:new Date(d0.getFullYear(),cal,day),lines,total:sum(lines.map(l=>l.qty*l.price))});
   }
  }
 });
 orders.sort((a,b)=>a.date-b.date);
 orders.forEach((o,i)=>o.id='SO-'+(24100+i));

 if(hist){const paid=addDays(o.due,Math.round(Math.max(-4,c.late+gauss()*Math.min(6,Math.max(2,c.late*.35)))));if(paid<=TODAY)o.paid=paid}}

/* ---------- forecasting: seasonal index × damped linear trend ---------- */
function linreg(y){const n=y.length;if(n<2)return{a:y[0]||0,b:0};const mx=(n-1)/2,my=avg(y);let num=0,den=0;y.forEach((v,i)=>{num+=(i-mx)*(v-my);den+=(i-mx)**2});const b=num/den;return{a:my-b*mx,b}}
function forecast(y,h=H){
 const n=y.length,z=()=>Array(h).fill(0);
 const first=y.findIndex(v=>v>0);
 if(first<0)return{f:z(),lo:z(),hi:z()};
 const seg=y.slice(first);
 let s=Array(12).fill(1);
 if(seg.length>=24){
  const{a,b}=linreg(seg);const r=Array.from({length:12},()=>[]);
  seg.forEach((v,i)=>{const t=a+b*i;if(t>0)r[(first+i)%12].push(v/t)});
  s=r.map(x=>x.length?1+.7*(avg(x)-1):1);const ms=avg(s);s=s.map(v=>v/ms);
 }
 const from=Math.max(first,n-12),win=y.slice(from).map((v,i)=>v/s[(from+i)%12]);
 if(win.length<3){const lvl=avg(win);const f=Array.from({length:h},(_,j)=>lvl*s[(n+j)%12]);return{f,lo:f.map(v=>v*.6),hi:f.map(v=>v*1.4)}}
 const{a,b}=linreg(win);
 const sd=Math.sqrt(avg(win.map((v,i)=>((v-(a+b*i))*s[(from+i)%12])**2)));
 const level=a+b*(win.length-1);
 const f=[],lo=[],hi=[];let acc=0;
 for(let j=0;j<h;j++){acc+=b*Math.pow(.85,j+1);const v=Math.max(0,(level+acc)*s[(n+j)%12]);const band=1.28*sd*Math.sqrt(1+(j+1)/3);f.push(v);lo.push(Math.max(0,v-band));hi.push(v+band)}
 return{f,lo,hi};
}

/* this month's orders count: booked + expected rest of month, and the pace nudges the months after */
const ELAPSED=(TODAY.getDate()-.5)/30;
function paced(fc,mtd){const f0=fc.f[0],exp=f0*ELAPSED,r=exp>0?Math.min(1.6,Math.max(.7,mtd/exp)):1;
 const g=j=>1+.2*(r-1)*Math.pow(.85,j-1);
 const m0=v=>mtd+v*(1-ELAPSED);
 return{f:fc.f.map((v,j)=>j?v*g(j):m0(v)),lo:fc.lo.map((v,j)=>j?v*g(j):m0(v)),hi:fc.hi.map((v,j)=>j?v*g(j):m0(v)),pace:r}}
/* retail shelf signal: how long since each product was delivered, against that store's usual reorder gap */
function shelfFor(cs){const by={};
 cs.orders.filter(o=>days(o.date,TODAY)<=365).forEach(o=>o.lines.forEach(l=>(by[l.p]||(by[l.p]=[])).push({d:o.date,q:l.qty})));
 return Object.entries(by).map(([p,a])=>{a.sort((x,y)=>x.d-y.d);const gaps=a.slice(1).map((x,i)=>days(a[i].d,x.d));
  const interval=gaps.length>=2?Math.max(7,median(gaps)):gaps.length?Math.max(14,gaps[0]):Math.max(30,cs.interval*3);
  const last=a.at(-1),since=days(last.d,TODAY),ratio=since/interval;
  return{p,n:a.length,interval,since,ratio,state:ratio<=1.25?'Moving':ratio<=2?'Slowing':'Sitting',last:last.d,qLast:last.q}}).sort((x,y)=>y.ratio-x.ratio)}
function verdict(ps,r){const why=[],y=ps.yoy??0,sit=r.carry>=2?r.sitting/r.carry:0;
 if(ps.yoy!=null)why.push(`Sales ${pct(ps.yoy)} over the last 12 months vs the 12 before`);

 if(y<=-.15||ps.dropped.length>=2){k='Review';cls='bad'}
 else if(y<=-.05||sit>=.5||ps.dropped.length===1){k='Watch';cls='warn'}

let S;
function compute(){
 S={cust:{},prod:{},total:Array(N).fill(0),mtd:0,mtdOrders:0,chRev:{All:Array(N+1).fill(0)}};
 CHS.forEach(ch=>S.chRev[ch]=Array(N+1).fill(0));
 CUSTOMERS.forEach(c=>S.cust[c.id]={c,rev:Array(N).fill(0),orders:[],pc12:{},pcPrev:{},mtd:0});
 PRODUCTS.forEach(p=>S.prod[p.id]={p,units:Array(N).fill(0),rev:Array(N).fill(0),b12:{},bPrev:{},last:{},cu:{},mtdU:0,mtdRev:0,alloc:0});
 orders.forEach(o=>{
  const m=monthIdx(o.date),cs=S.cust[o.c],ch=C[o.c].ch,open=OPEN.has(o.status);cs.orders.push(o);
  if(m>=0&&m<N){cs.rev[m]+=o.total;S.total[m]+=o.total}
  if(m===N){S.mtd+=o.total;S.mtdOrders++;cs.mtd+=o.total}
  if(m>=0&&m<=N){S.chRev.All[m]+=o.total;S.chRev[ch][m]+=o.total}
  o.lines.forEach(l=>{const ps=S.prod[l.p];
   if(m>=0&&m<N){ps.units[m]+=l.qty;ps.rev[m]+=l.qty*l.price}
   if(m===N){ps.mtdU+=l.qty;ps.mtdRev+=l.qty*l.price}
   if(m>=0&&m<=N)(ps.cu[o.c]||(ps.cu[o.c]=Array(N+1).fill(0)))[m]+=l.qty;
   if(open)ps.alloc+=l.qty;
   if(m>=12){ps.b12[o.c]=(ps.b12[o.c]||0)+l.qty;cs.pc12[l.p]=(cs.pc12[l.p]||0)+l.qty}
   else if(m>=0){ps.bPrev[o.c]=(ps.bPrev[o.c]||0)+l.qty;cs.pcPrev[l.p]=(cs.pcPrev[l.p]||0)+l.qty}
   if(!ps.last[o.c]||ps.last[o.c]<o.date)ps.last[o.c]=o.date;
  });
 });
 Object.values(S.cust).forEach(cs=>{
  cs.orders.sort((a,b)=>a.date-b.date);
  cs.rev12=sum(cs.rev.slice(12));cs.revPrev=sum(cs.rev.slice(0,12));
  cs.yoy=cs.revPrev>0?cs.rev12/cs.revPrev-1:null;
  const yr=cs.orders.filter(o=>days(o.date,TODAY)<=365);cs.n12=yr.length;cs.aov=yr.length?sum(yr.map(o=>o.total))/yr.length:0;
  const rec=cs.orders.filter(o=>days(o.date,TODAY)<=240).map(o=>o.date);
  const gaps=rec.slice(1).map((d,i)=>days(rec[i],d)).sort((a,b)=>a-b);
  cs.interval=gaps.length>=2?Math.max(3,gaps[Math.floor(gaps.length/2)]):30;
  cs.last=cs.orders.at(-1)?.date;cs.daysSince=cs.last?days(cs.last,TODAY):999;
  cs.next=cs.last?new Date(+cs.last+cs.interval*864e5):null;
  if(cs.daysSince>Math.max(45,3*cs.interval)){cs.status='Lapsed';cs.sev=3;cs.why=`No order in ${cs.daysSince} days. Usually orders every ${cs.interval} days.`}
  else if(cs.daysSince>cs.interval*1.4+3){cs.status='Reorder due';cs.sev=2;cs.why=`Usually orders every ${cs.interval} days. Last order ${cs.daysSince} days ago.`}
  else if(cs.yoy!=null&&cs.yoy<-.12){cs.status='Slowing';cs.sev=1;cs.why=`12-month revenue ${pct(cs.yoy)} vs prior year.`}
  else{cs.status='On track';cs.sev=0;cs.why=''}
  cs.fc=paced(cs.status==='Lapsed'?forecast(Array(N).fill(0)):forecast(cs.rev),cs.mtd);
  cs.shelf=cs.c.ch==='Retail'?shelfFor(cs):null;
 });
 const tf=forecast(S.total);
 S.fc={f:[],lo:[],hi:[]};
 for(let j=0;j<H;j++){const f=sum(Object.values(S.cust).map(cs=>cs.fc.f[j]));const w=(tf.hi[j]-tf.f[j]);S.fc.f.push(f);S.fc.lo.push(Math.max(0,f-w));S.fc.hi.push(f+w)}
 const pf=PRODUCTS.map(p=>paced(forecast(S.prod[p.id].rev),S.prod[p.id].mtdRev));
 for(let j=0;j<H;j++){const t=sum(pf.map(x=>x.f[j]))||1,k=S.fc.f[j]/t;pf.forEach(x=>{x.f[j]*=k;x.lo[j]*=k;x.hi[j]*=k})}
 PRODUCTS.forEach((p,i)=>{const ps=S.prod[p.id];ps.fc=pf[i];
  ps.fcU={f:pf[i].f.map(v=>v/p.price),lo:pf[i].lo.map(v=>v/p.price),hi:pf[i].hi.map(v=>v/p.price)};
  ps.rev12=sum(ps.rev.slice(12));ps.revPrev=sum(ps.rev.slice(0,12));ps.u12=sum(ps.units.slice(12));
  ps.yoy=ps.revPrev>0?ps.rev12/ps.revPrev-1:null;
  ps.buyers=Object.keys(ps.b12).length;
  const top=Object.entries(ps.b12).sort((a,b)=>b[1]-a[1])[0];ps.top=top?C[top[0]].name:'—';
  ps.dropped=Object.keys(ps.bPrev).filter(c=>ps.last[c]&&days(ps.last[c],TODAY)>120&&S.cust[c].status!=='Lapsed');
  ps.rate=(ps.units[N-1]+ps.units[N-2]+ps.mtdU)/((61+TODAY.getDate()-1)/7); // cases per week, last ~10 weeks
  ps.chU=Object.fromEntries(CHS.map(ch=>[ch,Array(N+1).fill(0)]));
  Object.entries(ps.cu).forEach(([c,a])=>a.forEach((v,m)=>ps.chU[C[c].ch][m]+=v));
 });
 S.rp={};PRODUCTS.forEach(p=>S.rp[p.id]={carry:0,moving:0,slowing:0,sitting:0,accts:[]});
 Object.values(S.cust).forEach(cs=>cs.shelf&&cs.shelf.forEach(s=>{const r=S.rp[s.p];r.carry++;r[s.state.toLowerCase()]++;r.accts.push({...s,c:cs.c.id})}));
 PRODUCTS.forEach(p=>S.prod[p.id].vd=verdict(S.prod[p.id],S.rp[p.id]));
 const bt=Array(6).fill(0);
 Object.values(S.cust).forEach(cs=>{const f=forecast(cs.rev.slice(0,18)).f;f.forEach((v,j)=>bt[j]+=v)});
 S.btErr=avg(bt.map((v,j)=>Math.abs(v-S.total[18+j])/S.total[18+j]));
}

let charts=[],chartSeq=0;
const niceMax=v=>{const p=10**Math.floor(Math.log10(v)),m=v/p;return [1,1.2,1.6,2,2.4,3,4,5,6,8,10].find(x=>x>=m-1e-9)*p};
function chartSlot(spec,h=240){const id='ch'+(chartSeq++);charts.push({id,spec,h});return `<div class="chart" id="${id}" style="height:${h}px"></div>`}
function lineChart({actual,fc,money=true,unit='',off=0}){
 const na=actual.length,n=na+(fc?fc.f.length:0),padL=money?50:44,padR=10,padT=12,padB=24;
 const all=[...actual,...(fc?fc.hi:[])];const max=niceMax(Math.max(1,...all)*1.05);
 const fv=v=>money?fmtK(v):Math.round(v).toLocaleString('en-CA')+unit;
 const xAt=(i,w)=>padL+i/(n-1)*(w-padL-padR);
 return{n,idx:(mx,w)=>Math.round((mx-padL)/(w-padL-padR)*(n-1)),gx:xAt,draw(w,h){
  const x=i=>xAt(i,w),y=v=>padT+(1-v/max)*(h-padT-padB);
  let g='';
  for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+=`<line x1="${padL}" x2="${w-padR}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${padL-8}" y="${yy+3.5}" text-anchor="end">${fv(v)}</text>`}
  const step=w<520?6:3;
  for(let i=0;i<n;i+=step)g+=`<text x="${x(i)}" y="${h-6}" text-anchor="${i===0?'start':'middle'}">${mLabel(i+off)}</text>`;
  const pts=actual.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  g+=`<polygon points="${x(0)},${y(0)} ${pts} ${x(na-1)},${y(0)}" fill="var(--text)" fill-opacity=".05"/>`;
  g+=`<polyline points="${pts}" fill="none" stroke="var(--text)" stroke-width="1.8" stroke-linejoin="round"/>`;
  if(fc){
   const xi=j=>x(na+j),p0=`${x(na-1)},${y(actual[na-1])}`;
   const top=[p0,...fc.hi.map((v,j)=>`${xi(j)},${y(v)}`)],bot=[...fc.lo.map((v,j)=>`${xi(j)},${y(v)}`).reverse(),p0];
   g+=`<line x1="${x(na-1)}" x2="${x(na-1)}" y1="${padT}" y2="${h-padB}" stroke="var(--ash)" stroke-dasharray="2 3"/>`;
   g+=`<text x="${x(na-1)+6}" y="${padT+10}">Forecast</text>`;
   g+=`<polygon points="${top.join(' ')} ${bot.join(' ')}" fill="var(--graphite)" fill-opacity=".12"/>`;
   g+=`<polyline points="${p0} ${fc.f.map((v,j)=>`${xi(j)},${y(v)}`).join(' ')}" fill="none" stroke="var(--graphite)" stroke-width="1.8" stroke-dasharray="5 4"/>`;
   g+=`<circle cx="${x(na-1)}" cy="${y(actual[na-1])}" r="3.5" fill="var(--text)"/>`;
  }
  g+=`<line class="guide" x1="0" x2="0" y1="${padT}" y2="${h-padB}" stroke="var(--text)" stroke-opacity=".3" visibility="hidden"/>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Monthly values with forecast">${g}</svg>`;
 },tip(i){return i<na?`${mLabel(i+off)} · actual <b>${fv(actual[i])}</b>`:`${mLabel(i+off)} · forecast <b>${fv(fc.f[i-na])}</b><br>likely ${fv(fc.lo[i-na])}–${fv(fc.hi[i-na])}`}};
}
function barChart({vals,labels,tips,cmp}){
 const n=vals.length,padL=50,padR=6,padT=12,padB=24;const max=niceMax(Math.max(1,...vals,...(cmp||[]))*1.05);
 const bw=w=>(w-padL-padR)/n;
 return{n,idx:(mx,w)=>Math.floor((mx-padL)/bw(w)),gx:(i,w)=>padL+(i+.5)*bw(w),draw(w,h){
  const b=bw(w),y=v=>padT+(1-v/max)*(h-padT-padB);let g='';
  for(let k=0;k<=4;k++){const v=max*k/4,yy=y(v);g+=`<line x1="${padL}" x2="${w-padR}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${padL-8}" y="${yy+3.5}" text-anchor="end">${fmtK(v)}</text>`}
  const every=Math.ceil(n/(w/46));
  vals.forEach((v,i)=>{const x=padL+i*b+b*.15,bwid=Math.max(1,b*.7);
   if(cmp)g+=`<rect x="${x}" y="${y(cmp[i])}" width="${bwid}" height="${Math.max(0,y(0)-y(cmp[i]))}" fill="none" stroke="var(--ash)" stroke-dasharray="2 2"/>`;
   g+=`<rect x="${x}" y="${y(v)}" width="${bwid}" height="${Math.max(0,y(0)-y(v))}" rx="2" fill="var(--text)" fill-opacity="${v?'.85':'0'}"/>`;
   if(i%every===0)g+=`<text x="${padL+(i+.5)*b}" y="${h-6}" text-anchor="middle">${labels[i]}</text>`});
  g+=`<line class="guide" x1="0" x2="0" y1="${padT}" y2="${h-padB}" stroke="var(--text)" stroke-opacity=".0" visibility="hidden"/>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Sales by period">${g}</svg>`;
 },tip:i=>tips[i]};
}
function spark(arr,w=96,h=26){const max=Math.max(...arr,1),x=i=>2+i/(arr.length-1)*(w-6),y=v=>h-3-(v/max)*(h-6);

function drawCharts(){

}

/* ---------- Production forecast ---------- */
let fcBy='product',fcUnit='cases',LEADM=3,SAFETY=15;
const zone=j=>j<LEADM?'lock':j===LEADM?'plan':'';
function planRow(pid){const ps=S.prod[pid],I=inv(pid),f=ps.fcU.f,start=monthDate(N+LEADM);
 const before=Math.max(0,f[0]-ps.mtdU)+sum(f.slice(1,LEADM)); // still to ship before the planning month
 const runsBefore=sum(I.runs.filter(r=>r.date<start).map(r=>r.qty));
 const proj=I.av+runsBefore-before,need=f[LEADM]*(1+SAFETY/100);
 return{proj,runsBefore,av:I.av,make:ps.p.hold?0:Math.max(0,r10(need-Math.max(0,proj)))}}
function vForecast(){
 const months=Array.from({length:H},(_,j)=>N+j),pm=N+LEADM,pmLong=monthDate(pm).toLocaleString('en-CA',{month:'long',year:'numeric'});
 const prodRows=Object.values(S.prod).map(ps=>({ps,pl:planRow(ps.p.id)}));
 const planCases=sum(prodRows.map(x=>x.ps.fcU.f[LEADM])),make=sum(prodRows.map(x=>x.pl.make)),short=prodRows.filter(x=>x.pl.proj<0).sort((a,b)=>a.pl.proj-b.pl.proj);
 const grp=`<tr><th></th>${LEADM?`<th colspan="${LEADM}" class="grp">Already in production</th>`:''}<th class="grp plan">Plan now</th>${H-LEADM-1>0?`<th colspan="${H-LEADM-1}" class="grp">Outlook</th>`:''}`;
 let table;
 if(fcBy==='product'&&fcUnit==='cases'){
  const rows=prodRows.sort((a,b)=>b.ps.fcU.f[LEADM]-a.ps.fcU.f[LEADM]);
  const tot=months.map((_,j)=>sum(rows.map(x=>x.ps.fcU.f[j])));

  const cells=(f,pl,isTot)=>f.map((v,j)=>j!==LEADM?`<td class="n ${zone(j)}">${nf(v)}</td>`:

   </tbody></table></div>`;
 }else{

  else rows=Object.values(S.prod).map(p=>({id:p.p.id,attr:'prod',name:p.p.name,sub:p.p.cat,f:p.fc.f,ly:p.rev.slice(12,18)}));
  rows.sort((a,b)=>sum(b.f)-sum(a.f));

  table=`<div class="tbl-wrap"><table><thead>${grp}<th colspan="2"></th></tr><tr><th>${fcBy==='customer'?'Account':fcBy==='channel'?'Channel':'Product'}</th>${months.map((m,j)=>`<th class="n ${zone(j)}">${mLabel(m)}</th>`).join('')}<th class="n">6-mo total</th><th class="n">vs last yr</th></tr></thead>

 }
 return `<div class="head"><div><span class="label">${fcLabel()} · planning ${mLabel(pm)}</span><h1>Production forecast</h1><p>Expected orders for every product, month by month, in cases. Ingredients and production take about ${LEADM} months, so what you decide today lands in ${pmLong}. ${LEADM?`${months.slice(0,LEADM).map(mName).join(', ')} ${LEADM===1?'is':'are'} already set.`:''} Every order that comes in updates it.</p></div></div>

/* ---------- Cash flow ---------- */
const HZ=90;
let CA={open:62000,cogs:42,payroll:16000,fixed:9500,risky:false,asOf:'2026-12-31',arFilter:'all'};
function payStats(cid){const os=S.cust[cid].orders,paid=os.filter(o=>o.paid&&days(o.paid,TODAY)<=365);
 const open=os.filter(o=>!o.paid&&o.delivery<=TODAY),over=open.filter(o=>o.due<TODAY);
 return{n:paid.length,dtp:avg(paid.map(o=>days(o.delivery,o.paid))),late:avg(paid.map(o=>days(o.due,o.paid))),openAmt:sum(open.map(o=>o.total)),
  overAmt:sum(over.map(o=>o.total)),oldest:over.length?Math.max(...over.map(o=>days(o.due,TODAY))):0,pos:sum(os.filter(o=>o.delivery>TODAY).map(o=>o.total))}}
function cashModel(){
 const D=HZ+1,di=d=>days(TODAY,d),Z=()=>Array(D).fill(0);
 const M={D,inv:Z(),po:Z(),fco:Z(),sup:Z(),pay:Z(),fix:Z(),items:[],excluded:0};
 const put=(k,d,v)=>{const i=di(d);if(i>=0&&i<D)M[k][i]+=v};
 orders.forEach(o=>{if(o.paid)return;const c=C[o.c];const exp=addDays(o.due,c.late);
  if(o.delivery<=TODAY){const over=days(o.due,TODAY),risky=over>60;
   const when=exp<=TODAY?addDays(TODAY,2+(o.total%7|0)):exp;
   M.items.push({o,kind:'invoice',when,over,risky});
   if(risky&&!CA.risky)M.excluded+=o.total;else put('inv',when,o.total);
  }else{M.items.push({o,kind:'po',when:exp,over:0});put('po',exp,o.total)}});
 const cg=CA.cogs/100;
 orders.forEach(o=>put('sup',addDays(o.date,30),o.total*cg));
 Object.values(S.cust).forEach(cs=>{const c=cs.c;const mtd=sum(cs.orders.filter(o=>monthIdx(o.date)===N).map(o=>o.total));
  for(let j=0;j<H;j++){const m=N+j,d0=monthDate(m),dim=new Date(d0.getFullYear(),d0.getMonth()+1,0).getDate();
   const first=j===0?TODAY.getDate()+1:1,amt=j===0?Math.max(0,cs.fc.f[0]-mtd):cs.fc.f[j],nd=dim-first+1;if(!amt||nd<=0)continue;
   for(let dd=first;dd<=dim;dd++){const sub=new Date(d0.getFullYear(),d0.getMonth(),dd),a=amt/nd;
    put('fco',addDays(sub,c.lead+1+c.terms+c.late),a);put('sup',addDays(sub,30),a*cg)}}});
 const payday0=new Date(2026,10,13);
 for(let i=0;i<D;i++){const d=addDays(TODAY,i);if(d.getDate()===1)M.fix[i]+=CA.fixed;const k=days(payday0,d);if(k>=0&&k%14===0)M.pay[i]+=CA.payroll}
 M.inn=M.inv.map((v,i)=>v+M.po[i]+M.fco[i]);M.out=M.sup.map((v,i)=>v+M.pay[i]+M.fix[i]);
 M.bal=[];let b=CA.open;for(let i=0;i<D;i++){b+=M.inn[i]-M.out[i];M.bal.push(b)}
 return M;
}
function cashChart(M,sel){
 const n=M.D,padL=56,padR=12,padT=16,padB=24,mx=Math.max(...M.bal,CA.open),mn=Math.min(0,...M.bal);
 const stp=niceMax((mx*1.05-Math.min(0,mn*1.1))/4),top=Math.ceil(mx*1.05/stp)*stp,bot=Math.floor(Math.min(0,mn*1.1)/stp)*stp,xAt=(i,w)=>padL+i/(n-1)*(w-padL-padR);
 const lo=M.bal.indexOf(Math.min(...M.bal));
 return{n,idx:(m,w)=>Math.round((m-padL)/(w-padL-padR)*(n-1)),gx:xAt,draw(w,h){
  const x=i=>xAt(i,w),y=v=>padT+(top-v)/(top-bot)*(h-padT-padB);let g='';
  for(let v=bot;v<=top+1;v+=stp){const yy=y(v);g+=`<line x1="${padL}" x2="${w-padR}" y1="${yy}" y2="${yy}" stroke="var(--line)"/><text x="${padL-8}" y="${yy+3.5}" text-anchor="end">${fmtK(v)}</text>`}
  if(bot<0)g+=`<line x1="${padL}" x2="${w-padR}" y1="${y(0)}" y2="${y(0)}" stroke="var(--brick)" stroke-opacity=".6"/>`;
  const step=w<560?28:14;for(let i=0;i<n;i+=step)g+=`<text x="${x(i)}" y="${h-6}" text-anchor="${i===0?'start':'middle'}">${dfmt(addDays(TODAY,i))}</text>`;
  const pts=M.bal.map((v,i)=>`${x(i)},${y(v)}`).join(' ');
  g+=`<polygon points="${x(0)},${y(Math.max(bot,0))} ${pts} ${x(n-1)},${y(Math.max(bot,0))}" fill="var(--text)" fill-opacity=".05"/>`;
  g+=`<polyline points="${pts}" fill="none" stroke="var(--text)" stroke-width="1.8" stroke-linejoin="round"/>`;
  if(sel>=0&&sel<n)g+=`<line x1="${x(sel)}" x2="${x(sel)}" y1="${padT}" y2="${h-padB}" stroke="var(--graphite)" stroke-dasharray="3 3"/><circle cx="${x(sel)}" cy="${y(M.bal[sel])}" r="4" fill="var(--text)"/>`;
  const lx=x(lo),anchor=lx>w-140?'end':lx<padL+60?'start':'middle';
  g+=`<circle cx="${lx}" cy="${y(M.bal[lo])}" r="4" fill="var(--bg)" stroke="${M.bal[lo]<0?'var(--brick)':'var(--text)'}" stroke-width="1.6"/><text x="${anchor==='end'?lx-8:anchor==='start'?lx+8:lx}" y="${Math.min(h-padB-6,y(M.bal[lo])+18)}" text-anchor="${anchor}" style="fill:var(--text)">Low ${fmtK(M.bal[lo])} · ${dfmt(addDays(TODAY,lo))}</text>`;
  g+=`<line class="guide" x1="0" x2="0" y1="${padT}" y2="${h-padB}" stroke="var(--text)" stroke-opacity=".3" visibility="hidden"/>`;
  return `<svg width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" role="img" aria-label="Projected daily bank balance for the next 90 days">${g}</svg>`;
 },tip(i){const d=addDays(TODAY,i);return `${d.toLocaleDateString('en-CA',{weekday:'short',month:'short',day:'numeric'})} · balance <b>${fmt$(M.bal[i])}</b><br>in ${fmt$(M.inn[i])} · out ${fmt$(M.out[i])}`}};
}
function vCash(){
 const M=cashModel(),D=M.D;
 let sel=days(TODAY,new Date(CA.asOf+'T00:00'));if(!(sel>=0&&sel<D)){sel=Math.min(D-1,days(TODAY,new Date(2026,11,31)));}
 const cum=k=>sum(M[k].slice(0,sel+1));
 const lo=M.bal.indexOf(Math.min(...M.bal));
 const inv=M.items.filter(x=>x.kind==='invoice'),po=M.items.filter(x=>x.kind==='po');
 const arTot=sum(inv.map(x=>x.o.total)),overdue=inv.filter(x=>x.over>0);
 const bucket=x=>x.over<=0?0:x.over<=30?1:x.over<=60?2:3;
 const bk=[0,1,2,3].map(b=>sum(inv.filter(x=>bucket(x)===b).map(x=>x.o.total)));
 const g=CUSTOMERS.filter(c=>c.type==='Grocery').map(c=>payStats(c.id)).filter(p=>p.n);
 const gLate=avg(g.map(p=>p.late));
 const in30=sum(M.inn.slice(0,31));
 const weeks=[];for(let s=0;s<D;s+=7){const e=Math.min(D,s+7),sl=k=>sum(M[k].slice(s,e));weeks.push({s,inv:sl('inv'),po:sl('po'),fco:sl('fco'),out:sl('out'),bal:M.bal[e-1]})}
 const custRows=CUSTOMERS.map(c=>({c,...payStats(c.id),next:M.items.filter(x=>x.o.c===c.id&&!(x.risky&&!CA.risky)).sort((a,b)=>a.when-b.when)[0]})).sort((a,b)=>b.openAmt+b.pos-(a.openAmt+a.pos));
 const flt=CA.arFilter,items=M.items.filter(x=>flt==='all'||(flt==='overdue'?x.kind==='invoice'&&x.over>0:flt==='po'?x.kind==='po':x.kind==='invoice'&&x.over<=0)).sort((a,b)=>a.when-b.when);
 const status=x=>x.kind==='po'?`<span class="pill info">In transit · delivers ${dfmt(x.o.delivery)}</span>`:x.over>60?`<span class="pill bad">${x.over} days overdue</span>`:x.over>0?`<span class="pill warn">${x.over} days overdue</span>`:`<span class="pill good">Due in ${days(TODAY,x.o.due)} days</span>`;
 return `<div class="head"><div><span class="label">Next 90 days · ${dfmt(TODAY)} – ${dfmt(addDays(TODAY,HZ))}</span><h1>Cash flow</h1><p>When the money from each order arrives. Every PO from a retailer portal gets an estimated delivery date and a due date from that customer's terms. It's then shifted by how late that customer usually pays.</p></div></div>

 <div class="kpis">

 PRODUCTS.forEach(p=>{const I=inv(p.id);o.av[p.id]=I.av;o.oh[p.id]=I.oh;o.plan[p.id]=S.prod[p.id].fcU.f[LEADM]});

function cascade(title,b,{cid,pids,extra=[],by=me}){const a=snap(),items=[],ps=[...new Set(pids)];
 ps.forEach(p=>{const I=inv(p);
  if(a.av[p]!==b.av[p])items.push(['Inventory',`${esc(P[p].name)}: ${nf(b.av[p])} → ${nf(a.av[p])} cases available${I.status==='Low'||I.status==='Out'?'. <b class="down">Below the reorder point.</b>':''}`]);
  else if(a.oh[p]!==b.oh[p])items.push(['Inventory',`${esc(P[p].name)}: ${nf(b.oh[p])} → ${nf(a.oh[p])} cases on hand, oldest lot first`])});
 ps.forEach(p=>{const d=a.plan[p]-b.plan[p];if(Math.abs(d)>=1)items.push(['Forecast',`${esc(P[p].name)}, ${mLabel(N+LEADM)}: ${d>0?'+':''}${Math.round(d)} cases to plan`])});
 if(Math.round(a.fcT)!==Math.round(b.fcT))items.push(['Forecast',`${fcLabel()} total ${fmtK(b.fcT)} → ${fmtK(a.fcT)}`]);
 if(cid&&a.st[cid]!==b.st[cid])items.push(['Account',`${esc(C[cid].name)}: ${b.st[cid]} → ${a.st[cid]}`]);
 if(Math.round(a.cash/100)!==Math.round(b.cash/100))items.push(['Cash flow',`Dec 31 balance ${fmtK(b.cash)} → ${fmtK(a.cash)}`]);
 items.push(...extra,['Activity log',`Recorded under ${esc(U[by].name)}, ${tfmt(now())}`]);

function lotAction(v){const i=v.indexOf('|'),id=v.slice(0,i),a=v.slice(i+1),l=LOTS.find(x=>x.id===id),p=P[l.p];
 l.action={a,by:me,t:now()};log('Inventory',`Expiry plan: ${a}`,`${p.name} · lot ${l.id}`,`${l.qty} cases, expires ${dfmt(l.exp)}`);
 let msg=`Noted for lot ${l.id}. The team sees it on the product.`;
 if(a==="Don't reorder"){p.hold=true;RUNS.filter(r=>r.p===l.p&&r.status==='Scheduled').forEach(r=>{r.status='Cancelled';log('Inventory','Cancelled a production run',p.name,`${r.id}, ${r.qty} cases`)});
  log('Products','Put on reorder hold',p.name,'From the expiry alert');msg=`${p.name} is on hold. The production forecast won't suggest more until someone lifts it.`}
 if(a==='Feature to top buyers'){const top=Object.entries(S.prod[l.p].b12).sort((x,y)=>y[1]-x[1]).slice(0,3).map(x=>C[x[0]].name);msg=`Added to the next call with ${top.join(', ')}.`;
  top.forEach(n=>{const c=CUSTOMERS.find(x=>x.name===n);NOTES.push({c:c.id,t:now(),by:me,type:'Note',text:`Offer ${p.name}: lot ${l.id} expires ${dfmt(l.exp)}. Feature it on the next order.`})})}
 render();refreshDrawer();toast(msg)}

function receiveRun(id){const r=RUNS.find(x=>x.id===id),before=snap();r.status='Received';
 const lot={id:lotId(TODAY,r.p),p:r.p,qty:r.qty,made:new Date(TODAY),exp:addDays(TODAY,SHELF[P[r.p].cat]),action:null};LOTS.push(lot);
 log('Inventory','Received a production run',P[r.p].name,`${r.id}: +${r.qty} cases as lot ${lot.id}`);compute();render();refreshDrawer();
 cascade(`${r.id} received`,before,{pids:[r.p]})}

  <div style="display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap"><div><h2>Your order guide</h2><span class="muted" style="font-size:13px">${guide.length} products you buy · your prices · net ${c.terms} terms</span></div><label class="check" for="portAll"><input type="checkbox" id="portAll" ${portAll?'checked':''}>Show the full catalogue</label></div>
  <form id="portalForm" style="display:flex;flex-direction:column;gap:16px">
  <div class="tbl-wrap"><table style="min-width:600px"><thead><tr><th>Product</th><th class="n">Your price</th><th>Last ordered</th><th class="n">Cases</th></tr></thead><tbody>
   ${ids.map(pid=>{const p=P[pid],lq=lastQ(pid);return `<tr><td><span class="pcell">${thumb(p)}<span><b>${esc(p.name)}</b><span class="sub">${p.pack}</span></span></span></td><td class="n">${fmt$(p.price)} / case</td><td>${lq?`${lq.q} cs · ${dfmt(lq.d)}`:'<span class="muted">—</span>'}</td><td class="n"><input class="qty" type="number" min="0" step="1" data-pq="${pid}" value="${portQ[pid]||''}" placeholder="0" aria-label="Cases of ${esc(p.name)}"></td></tr>`}).join('')}
  </tbody></table></div>
  <div class="assume"><label for="portPo">Your PO number<input id="portPo" name="po" placeholder="Optional"></label><label for="portDate">Requested delivery<input id="portDate" name="date" type="date" value="${iso(addDays(TODAY,c.lead+1))}" min="${iso(addDays(TODAY,1))}"></label><label for="portTot">Order total<input id="portTot" value="${fmt$(tot)}" disabled></label><label style="justify-content:flex-end"><button class="btn primary" type="submit" style="align-self:stretch;justify-content:center">Place order</button></label></div>
  </form></div></div>`;
}

/* ---------- drawer, modal, routing ---------- */
const drawer=document.getElementById('drawer'),scrim=document.getElementById('scrim'),modal=document.getElementById('modal');
function openDrawer(html,keep){const st=drawer.scrollTop;
 drawer.innerHTML=html;
 charts=charts.filter(c=>document.getElementById(c.id));charts.forEach(c=>{if(drawer.contains(document.getElementById(c.id)))c.inDrawer=true});
 drawer.classList.add('on');scrim.classList.add('on');drawer.setAttribute('aria-hidden','false');drawer.scrollTop=keep?st:0;
 drawCharts();if(!keep)drawer.querySelector('.x').focus();
}
function closeDrawer(){drawer.classList.remove('on');scrim.classList.remove('on');drawer.setAttribute('aria-hidden','true');charts=charts.filter(c=>!c.inDrawer);drawerFn=null}
function refreshDrawer(){if(drawer.classList.contains('on')&&drawerFn)drawerFn()}
scrim.onclick=closeDrawer;
addEventListener('keydown',e=>{if(e.key==='Escape'){if(!modal.hidden)modal.hidden=true;else closeDrawer()}
 if(e.key==='Enter'&&e.target.matches('tr[data-cust],tr[data-prod],tr[data-po],tr[data-ded]'))e.target.click()});

const views={overview:vOverview,orders:vOrders,inventory:vInventory,customers:vCustomers,retail:vRetail,deductions:vDeductions,pipeline:vPipeline,
 products:vProducts,forecast:vForecast,reports:vReports,cash:vCash,activity:vActivity,connections:vConnections,portal:vPortal};
let current='overview';
function render(){
 const h=location.hash.slice(1);current=Object.hasOwn(views,h)?h:'overview';
 renderNav(current);charts=charts.filter(c=>c.inDrawer);
 document.getElementById('main').innerHTML=`<div class="wrap">${views[current]()}</div>`;
 if(current==='reports'){
  document.getElementById('csvBtn').onclick=downloadCSV;
  document.getElementById('printBtn').onclick=()=>window.print();
 }
 drawCharts();
}
addEventListener('hashchange',()=>{render();scrollTo(0,0)});
addEventListener('beforeprint',()=>document.querySelectorAll('[data-print="show"]').forEach(el=>{el.dataset.wasHidden=el.hidden;el.hidden=false}));
addEventListener('afterprint',()=>document.querySelectorAll('[data-print="show"]').forEach(el=>{el.hidden=el.dataset.wasHidden==='true'}));

function moveDeal(id,dir){const d=deals.find(x=>x.id==id),from=d.stage;d.stage=Math.min(4,Math.max(0,d.stage+dir));
 if(d.stage!==from)log('Pipeline','Moved deal',d.acct,`${STAGES[from][0]} → ${STAGES[d.stage][0]}`);
 render();if(d.stage===4&&from!==4)toast(`${d.acct} marked won: ${fmt$(d.v)}/mo added.`)}
const ACT={
 rclose:()=>document.getElementById('ripple').classList.remove('on'),
 mclose:()=>{modal.hidden=true},
 close:()=>closeDrawer(),
 adv:v=>advance(v),
 recok:v=>reviewRec(+v),
 recall:()=>{recAll=!recAll;render()},
 lotact:v=>lotAction(v),
 run:v=>scheduleRun(v),
 recv:v=>receiveRun(v),
 unhold:v=>{P[v].hold=false;log('Products','Lifted reorder hold',P[v].name);render();refreshDrawer();toast(`${P[v].name} is back in the production forecast.`)},
 newded:v=>newDedModal(v||null),
 sim:v=>simulate(v),
 actcsv:()=>activityCSV(),
 move:(v,t)=>moveDeal(v,+t.dataset.dir),
 po:v=>openPO(v),
 ded:v=>openDed(v),
 cust:v=>openCustomer(v),
 prod:v=>openProduct(v),
 ordf:v=>{ordF=v;render()},
 invf:v=>{invF=v;render()},
 dedf:v=>{dedF=v;render()},
 actu:v=>{actU=v;render()},
 ch:v=>{custFilter=v;render()},
 cat:v=>{prodCat=v;render()},
 prange:v=>{prodRange=+v;render()},
 pdr:v=>{pdRange=+v;refreshDrawer()},
 sort:v=>{custSort=v;render()},
 fcby:v=>{fcBy=v;render()},
 fcunit:v=>{fcUnit=v;render()},
 repby:v=>{repBy=v;render()},
 repch:v=>{repCh=v;render()},
 arf:v=>{CA.arFilter=v;render()},
};
const ACT_SEL=Object.keys(ACT).map(k=>`[data-${k}]`).join(',');
document.addEventListener('click',e=>{const t=e.target.closest(ACT_SEL);if(!t)return;
 for(const k in ACT)if(t.dataset[k]!=null){ACT[k](t.dataset[k],t);return}});
const refocus=id=>{const s=document.getElementById(id);if(s){s.focus();s.setSelectionRange(s.value.length,s.value.length)}};
document.addEventListener('input',e=>{const t=e.target;
 if(t.id==='custSearch'){custQ=t.value;render();refocus('custSearch')}
 else if(t.id==='actSearch'){actQ=t.value;render();refocus('actSearch')}
 else if(t.id==='chkQ'){chkQ=Math.max(0,Math.floor(+t.value||0));updStock()}
 else if(t.dataset.pq){const q=Math.max(0,Math.floor(+t.value||0));if(q)portQ[t.dataset.pq]=q;else delete portQ[t.dataset.pq];
  document.getElementById('portTot').value=fmt$(sum(Object.entries(portQ).map(([p,q])=>q*P[p].price)))}
});
document.addEventListener('change',e=>{const t=e.target;
 if(t.id==='meSel'){me=t.value;render();refreshDrawer();toast(`Signed in as ${U[me].name}. Everything from here is logged under that name.`)}
 else if(t.id==='repSel'){repId=t.value;render()}
 else if(t.dataset.ca!=null){const k=t.dataset.ca;CA[k]=t.type==='checkbox'?t.checked:t.type==='date'?t.value:Math.max(0,+t.value||0);render()}
 else if(t.dataset.fc){if(t.dataset.fc==='lead')LEADM=+t.value;else SAFETY=Math.max(0,Math.min(100,+t.value||0));render()}
 else if(t.id==='prodChSel'){prodCh=t.value;render()}
 else if(t.id==='actMod'){actM=t.value;render()}
 else if(t.id==='portSel'){portC=t.value;portQ={};portDone=null;render()}
 else if(t.id==='portAll'){portAll=t.checked;render()}
 else if(t.id==='chkP'){chkP=t.value;updStock()}
 else if(t.id==='ndC'){document.getElementById('ndInv').innerHTML=invOpts(t.value)}
});
const short=s=>s.length>90?s.slice(0,88)+'…':s;
document.addEventListener('submit',e=>{const f=e.target,fd=new FormData(f),g=k=>String(fd.get(k)||'').trim();
 if(f.id==='noteForm'){e.preventDefault();const c=f.dataset.c,text=g('text');if(!text)return;const type=g('type');
  NOTES.push({c,t:now(),by:me,type,text});log('Accounts',`Added a ${type.toLowerCase()} note`,C[c].name,short(text));
  render();refreshDrawer();toast('Note saved. Anyone who opens this account will see it.')}
 else if(f.id==='contactForm'){e.preventDefault();const c=f.dataset.c,n=g('n');if(!n)return;
  CONTACTS[c].unshift({n,r:g('r'),ph:g('ph'),best:g('best'),since:'Nov 2026'});log('Accounts','Added a contact',C[c].name,`${n}${g('r')?', '+g('r'):''}`);
  refreshDrawer();toast(`${n} added to ${C[c].name}.`)}
 else if(f.id==='dedForm'){e.preventDefault();const d=DEDS.find(x=>x.id===f.dataset.d),text=g('text'),st=g('status'),mean=g('meaning');if(!text)return;
  const old=d.status;d.actions.push({t:now(),by:me,text});d.status=st;
  log('Deductions',old!==st?`Updated a deduction: ${old} → ${st}`:'Updated a deduction',`${d.id} · ${C[d.c].name}`,short(text));
  if(mean){DCODES.push({c:d.c,code:d.code,meaning:mean});log('Deductions','Explained a deduction code',`${C[d.c].name} · ${d.code}`,mean)}
  render();refreshDrawer();toast(`${d.id} updated${old!==st?`: ${st}`:''}.`)}
 else if(f.id==='newDedForm'){e.preventDefault();const c=g('c'),code=g('code'),amt=+g('amt'),issue=g('issue'),act=g('act');if(!code||!amt||!issue)return;
  const m=codeMeaning(c,code),[y,mo,dd]=g('date').split('-').map(Number);
  const d={id:'DED-'+(1040+DEDS.length),c,date:new Date(y,mo-1,dd,now().getHours(),now().getMinutes()),inv:g('inv')||'—',code,amt,issue,status:act?'Investigating':m?'Investigating':'Unexplained',actions:act?[{t:now(),by:me,text:act}]:[]};
  DEDS.unshift(d);log('Deductions','Logged a deduction',`${d.id} · ${C[c].name}`,`${fmt$(amt)} on ${d.inv}, code ${code}`);
  modal.hidden=true;render();refreshDrawer();toast(m?`Logged ${d.id}. Code ${code} at ${C[c].name} means: ${m.meaning}.`:`Logged ${d.id}. Code ${code} is new for ${C[c].name}, so it's marked unexplained.`)}
 else if(f.id==='portalForm'){e.preventDefault();
  const lines=Object.entries(portQ).filter(([,q])=>q>0).map(([p,q])=>({p,qty:q,price:P[p].price}));
  if(!lines.length){toast('Add a case count to at least one product.');return}
  const ct=(CONTACTS[portC]||[]).find(x=>!x.left),dt=g('date');
  const o=newOrder(portC,lines,'Portal',g('po')?`Portal PO ${g('po')}`:null,'sys',{note:`Placed by ${ct?ct.n:'the buyer'}${dt?`, delivery requested for ${dfmt(new Date(dt+'T00:00'))}`:''}`});
  portQ={};portDone=o.id;render()}
});

function toast(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('on');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('on'),4200)}
document.getElementById('logBtn').onclick=()=>{
 const due=Object.values(S.cust).filter(c=>c.sev===2).sort((a,b)=>b.rev12-a.rev12)[0];
 const popts=sel=>CATS.map(cat=>`<optgroup label="${esc(cat)}">${PRODUCTS.filter(p=>p.cat===cat).map(p=>`<option value="${p.id}" ${p.id===sel?'selected':''}>${esc(p.name)}</option>`).join('')}</optgroup>`).join('');
 modal.innerHTML=`<form id="orderForm"><h2>Take a phone order</h2><p class="muted" style="margin:0;font-size:13px">It goes into the shared Orders inbox, already claimed by you, and updates stock, the forecast and cash flow right away.</p>
  <label class="field" for="oc">Customer<select id="oc">${CUSTOMERS.map(c=>`<option value="${c.id}" ${due&&c.id===due.c.id?'selected':''}>${esc(c.name)}</option>`).join('')}</select></label>
  <label class="field" for="opo">Customer's PO number (optional)<input id="opo" placeholder="e.g. 7731"></label>
  <div class="field">Products and cases<div class="lines">
   <select id="op1" aria-label="Product 1">${popts('chb')}</select><input id="oq1" type="number" min="0" value="6" aria-label="Cases 1">
   <select id="op2" aria-label="Product 2">${popts('bbq')}</select><input id="oq2" type="number" min="0" value="4" aria-label="Cases 2">
   <select id="op3" aria-label="Product 3">${popts('hkb')}</select><input id="oq3" type="number" min="0" value="0" aria-label="Cases 3"></div></div>
  <div class="actions"><button type="button" class="btn" data-mclose>Cancel</button><button class="btn primary" type="submit">Log order</button></div></form>`;
 modal.hidden=false;document.getElementById('oc').focus();
 document.getElementById('orderForm').onsubmit=e=>{e.preventDefault();
  const lines=[1,2,3].map(i=>({p:document.getElementById('op'+i).value,qty:Math.floor(+document.getElementById('oq'+i).value||0)})).filter(l=>l.qty>0).map(l=>({...l,price:P[l.p].price}));
  if(!lines.length){toast('Add at least one product with a case count.');return}
  const po=document.getElementById('opo').value.trim();
  modal.hidden=true;newOrder(document.getElementById('oc').value,lines,'Phone',po?`Phone order, PO ${po}`:null,me,{claim:true});
 };
};
modal.addEventListener('click',e=>{if(e.target===modal)modal.hidden=true});

seedOrders();compute();initInventory();seedRest();render();
</script>
</body>
</html>

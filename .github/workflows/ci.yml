name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  # Which units this change touches. Jobs always run and gate on steps (same
  # rationale as gtm-engine/lead-crm: a skipped required check blocks merges).
  changes:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      backend: ${{ steps.filter.outputs.backend }}
      frontend: ${{ steps.filter.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            backend:
              - 'demo-backend/**'
              - '.github/workflows/ci.yml'
            frontend:
              - 'src/**'
              - 'index.html'
              - 'package.json'
              - 'package-lock.json'
              - 'vite.config.js'
              - '.github/workflows/ci.yml'

  demo-backend:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.backend == 'true'
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: demo-backend/package-lock.json
      - if: needs.changes.outputs.backend == 'true'
        run: npm ci
        working-directory: demo-backend
      - if: needs.changes.outputs.backend == 'true'
        run: npx tsc --noEmit
        working-directory: demo-backend
      - if: needs.changes.outputs.backend == 'true'
        run: npx vitest run
        working-directory: demo-backend

  # The site itself deploys via Vercel; CI just keeps lint and the build green.
  frontend:
    runs-on: ubuntu-latest
    needs: changes
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        if: needs.changes.outputs.frontend == 'true'
        with:
          node-version: 20
          cache: npm
      - if: needs.changes.outputs.frontend == 'true'
        run: npm ci
      - if: needs.changes.outputs.frontend == 'true'
        run: npm run lint
      - if: needs.changes.outputs.frontend == 'true'
        run: npm run build
